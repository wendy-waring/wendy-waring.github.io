<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Wendy Waring</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: #f2f2f2;
            color: #111;
        }

        /* ===== HEADER ===== */
        .header {
            max-width: 1200px;
            margin: auto;
            padding: 6px 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            flex-wrap: wrap;
        }

        .title img {
            width: 255px;
            mix-blend-mode: multiply;
            display: block;
        }

        .divider {
            max-width: 1200px;
            margin: 8px auto;
            border-top: 1px solid #333;
        }

        /* ===== DESKTOP NAV ===== */
        nav {
            max-width: 1200px;
            margin: auto;
            padding: 6px 40px;
        }

        .menu {
            display: flex;
            justify-content: space-between;
            max-width: 900px;
            font-size: 18px;
        }

        .menu a {
            text-decoration: none;
            color: #111;
        }

        /* ===== MOBILE HAMBURGER ===== */
        .menu-toggle {
            display: none;
            width: 32px;
            height: 24px;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            margin-left: auto;
        }

        .menu-toggle span {
            display: block;
            height: 3px;
            background: #111;
            border-radius: 2px;
            transition: 0.3s ease;
        }

        /* HAMBURGER → X */
        .menu-toggle.active span:nth-child(1) {
            transform: translateY(10px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-10px) rotate(-45deg);
        }

        /* ===== MOBILE MENU ===== */
        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 16px;
            background: #f2f2f2;
            padding: 20px 40px;
            text-align: right;
            font-size: 18px;
        }

        .mobile-menu a {
            text-decoration: none;
            color: #111;
        }

        .mobile-menu.active {
            display: flex;
        }

        /* ===== CONTACT CONTENT ===== */
        .contact-wrapper {
            max-width: 700px;
            margin: 40px auto;
            text-align: center;
            padding: 0 40px;
        }

        .contact-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .intro {
            font-size: 18px;
            line-height: 1.7;
        }

        .email {
            font-size: 20px;
            margin-top: 10px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        input,
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
        }

        button {
            background: black;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .social-title {
            margin-top: 30px;
            font-size: 18px;
        }

        .social img {
            width: 34px;
            margin: 15px 10px 0 10px;
        }

        /* ===== MOBILE ===== */
        @media(max-width:900px) {

            /* Hide desktop nav + dividers */
            nav,
            .divider {
                display: none;
            }

            /* Hamburger appears */
            .menu-toggle {
                display: flex;
            }

            /* Mobile menu */
            .mobile-menu {
                display: none;
            }

            .mobile-menu.active {
                display: flex;
            }

            .contact-box {
                padding: 25px;
            }

            .email {
                font-size: 18px;
                word-break: break-word;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <div class="title">
            <img src="V2 Draft Gothic W.png" alt="Wendy Waring logo">
        </div>

        <!-- HAMBURGER (mobile only) -->
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- DESKTOP DIVIDER -->
    <div class="divider"></div>

    <!-- DESKTOP NAV -->
    <nav>
        <div class="menu">
            <a href="index.html">Welcome</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="works.html">Works</a>
            <a href="news.html">News</a>
        </div>
    </nav>

    <!-- DESKTOP DIVIDER -->
    <div class="divider"></div>

    <!-- MOBILE MENU -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Welcome</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="works.html">Works</a>
        <a href="news.html">News</a>
    </div>

    <!-- CONTACT CONTENT -->
    <section class="contact-wrapper">

        <div class="contact-box">

            <p class="intro">
                Interested in a book club visit? Have a question about rights? Want a curated walk in Paris?
                Want my newsletter, right in your inbox?
            </p>

            <p class="email">
                Send me a message — <strong>contact@wendy-waring.com</strong>
            </p>

            <form action="mailto:contact@wendy-waring.com" method="post" enctype="text/plain">
                <input name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="message" rows="6" placeholder="Message" required></textarea>
                <button type="submit">Send</button>
            </form>

            <div class="social-title">Find me online:</div>

            <div class="social">
                <a href="https://www.instagram.com/wendy.e.waring/" target="_blank">
                    <img src="insta_icon.jpg">
                </a>

                <a href="https://www.goodreads.com/author/show/2065491.Wendy_Waring" target="_blank">
                    <img src="goodreads_icon.png">
                </a>

                <a href="https://bsky.app/profile/wendywaring.bsky.social" target="_blank">
                    <img src="bluesky_icon.jpg">
                </a>
            </div>

        </div>
    </section>

    <!-- JAVASCRIPT -->
    <script>
        function toggleMenu() {
            const menu = document.getElementById("mobileMenu");
            const toggle = document.querySelector(".menu-toggle");

            menu.classList.toggle("active");
            toggle.classList.toggle("active");
        }
    </script>

</body>

</html>
