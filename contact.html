<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Wendy Waring</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: #f2f2f2;
            color: #111;
        }

        /* ===== HEADER (no socials on this page) ===== */

        .header {
            max-width: 1200px;
            margin: auto;
            padding: 6px 40px 0px 40px;
            display: flex;
            justify-content: flex-start;
        }

 .title img {
    width: 255px;
    mix-blend-mode: multiply;
    display: block;
    margin-bottom: 20px; /* or 30px if you want more space */
}

        .divider {
            max-width: 1200px;
            margin: 8px auto;
            border-top: 1px solid #333;
        }

        nav {
            max-width: 1200px;
            margin: auto;
            padding: 6px 40px;
        }

        .menu {
            display: flex;
            justify-content: space-between;
            max-width: 900px;
            font-size: 18px;
        }

        .menu a {
            text-decoration: none;
            color: #111;
        }

        /* ===== CONTACT LAYOUT ===== */

        .contact-grid {
            max-width: 1000px;
            margin: 60px auto;
            display: grid;
            grid-template-columns: 65% 35%;
            gap: 40px;
            padding: 0 40px;
        }

        .contact-wrap {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        input,
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
        }

        button {
            background: black;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        /* right social column */
        .social-side h3 {
            margin-top: 0;
            font-weight: normal;
        }

        .social-side a {
            display: block;
            margin: 20px 0;
        }

        .social-side img {
            width: 38px;
        }

        /* mobile */
        @media(max-width:900px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="title">
            <img src="V2 Draft Gothic W.png">
        </div>
    </div>

    <div class="divider"></div>

    <nav>
        <div class="menu">
            <a href="index.html">Welcome</a>
            <a href="about.html">About</a>
            <a href="Contact.html">Contact</a>
            <a href="works.html">Works</a>
            <a href="News.html">News</a>
        </div>
    </nav>

    <div class="divider"></div>

    <section class="contact-grid">

        <div class="contact-wrap">
            <p>To get on my distribution list or for book club enquiries:<br>
                <strong>contact@wendy-waring.com</strong>
            </p>

            <h2>Send me a message</h2>

            <form action="mailto:contact@wendy-waring.com" method="post" enctype="text/plain">
                <input name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="message" rows="6" placeholder="Message" required></textarea>
                <button type="submit">Send</button>
            </form>
        </div>

        <div class="social-side">
            <h3>Find me online</h3>

            <a href="https://www.instagram.com/wendy.e.waring/" target="_blank">
                <img src="insta_icon.jpg">
            </a>

            <a href="https://www.goodreads.com/author/show/2065491.Wendy_Waring" target="_blank">
                <img src="goodreads_icon.png">
            </a>

            <a href="https://bsky.app/profile/wendywaring.bsky.social" target="_blank">
                <img src="bluesky_icon.jpg">
            </a>

        </div>

    </section>

</body>

</html>
