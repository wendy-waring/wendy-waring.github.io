<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — Wendy Waring</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="fav_icon.png">

    <style>
        body {
            margin: 0;
            font-family: "Palatino Linotype", Palatino, serif;
            background: #f2f2f2;
            color: #111;
        }

        /* ================= HEADER ================= */

        .header {
            max-width: 1200px;
            margin: auto;
            padding: 6px 40px 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .title {
            justify-self: start;
        }

        .title img {
            width: 250px;
            max-width: 60vw;
            mix-blend-mode: multiply;
            display: block;
        }

        /* DESKTOP MENU */
        .menu-desktop {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 18pt;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .menu-desktop a {
            text-decoration: none;
        }

        .menu-desktop a:nth-child(1) {
            color: #00A2E8;
        }

        .menu-desktop a:nth-child(2) {
            color: #A349A4;
        }

        .menu-desktop a:nth-child(3) {
            color: #3F48CC;
        }

        .menu-desktop a:nth-child(4) {
            color: #22B14C;
        }

        /* HAMBURGER */
        .menu-toggle {
            display: none;
            width: 32px;
            height: 24px;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            z-index: 2000;
            justify-self: end;
        }

        .menu-toggle span {
            height: 3px;
            background: #111;
            border-radius: 2px;
            transition: 0.3s ease;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(10px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-10px) rotate(-45deg);
        }

        /* MOBILE MENU */
        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 16px;
            background: #f2f2f2;
            padding: 20px;
            text-align: right;
            font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16pt;
            box-sizing: border-box;
            width: 100%;
        }

        .mobile-menu a {
            text-decoration: none;
        }

        .mobile-menu a:nth-child(1) {
            color: #00A2E8;
        }

        .mobile-menu a:nth-child(2) {
            color: #A349A4;
        }

        .mobile-menu a:nth-child(3) {
            color: #3F48CC;
        }

        .mobile-menu a:nth-child(4) {
            color: #22B14C;
        }

        .mobile-menu.active {
            display: flex;
        }

        /* ================= CONTACT ================= */

        .contact-wrapper {
            max-width: 900px;
            margin: 50px auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 40px;
            padding: 0 40px;
        }

        .contact-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            flex: 1;
        }

        .intro {
            font-size: 18px;
            line-height: 1.7;
        }

        .email {
            font-size: 20px;
            margin-top: 20px;
        }

        .social-title {
            margin-top: 30px;
            font-size: 18px;
        }

        .social-inline {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 15px;
        }

        .social-inline img {
            width: 34px;
            height: 34px;
        }

        /* AUTHOR PHOTO */
        .author-photo {
            flex: 0 0 280px;
            text-align: center;
        }

        .author-photo img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* ================= MOBILE ================= */

        @media(max-width:900px) {
            .menu-desktop {
                display: none;
            }

            .header {
                grid-template-columns: 1fr auto;
                padding: 8px 20px 0;
            }

            .menu-toggle {
                display: flex;
            }

            .contact-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .author-photo {
                order: -1;
                width: 70%;
                margin-bottom: 20px;
            }

            .contact-box {
                padding: 25px;
            }

            .email {
                font-size: 18px;
                word-break: break-word;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="title">
            <img src="V2 Draft Gothic W.png" alt="Logo">
        </div>

        <!-- DESKTOP MENU -->
        <nav class="menu-desktop">
            <a href="index.html">Welcome</a>
            <a href="works.html">Works</a>
            <a href="contact.html">Contact</a>
            <a href="news.html">News</a>
        </nav>

        <!-- HAMBURGER -->
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </header>

    <!-- MOBILE MENU -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Welcome</a>
        <a href="works.html">Works</a>
        <a href="contact.html">Contact</a>
        <a href="news.html">News</a>
    </div>

    <!-- CONTACT CONTENT -->
    <section class="contact-wrapper">

        <div class="contact-box">
            <p class="intro">
                Interested in a book club visit?<br>
                Have a question about rights?<br>
                Want my newsletter, right in your inbox?
            </p>

            <p class="email">
                Send me a message — <strong>wendy@wendy-waring.com</strong>
            </p>

            <div class="social-title">Find me online:</div>

            <div class="social-inline">
                <a href="https://bsky.app/profile/wendywaring.bsky.social" target="_blank">
                    <img src="bluesky_icon.jpg" alt="Bluesky">
                </a>
                <a href="https://www.goodreads.com/author/show/2065491.Wendy_Waring" target="_blank">
                    <img src="goodreads_icon.png" alt="Goodreads">
                </a>
                <a href="https://www.instagram.com/wendy.e.waring/" target="_blank">
                    <img src="insta_icon.jpg" alt="Instagram">
                </a>
            </div>

            <div style="text-align:center; margin-top:8px; font-size:12px;">
                BlueSky &nbsp;&nbsp; Goodreads &nbsp;&nbsp; Instagram
            </div>
        </div>

        <div class="author-photo">
            <img src="author-photo_2.jpg" alt="Author photo">
        </div>

    </section>

    <script>
        function toggleMenu() {
            const menu = document.getElementById("mobileMenu");
            const toggle = document.querySelector(".menu-toggle");
            menu.classList.toggle("active");
            toggle.classList.toggle("active");
        }
    </script>

</body>

</html>
